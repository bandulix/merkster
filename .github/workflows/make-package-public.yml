name: Make container public

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/make-package-public.yml

permissions:
  contents: read
  packages: write

jobs:
  public:
    runs-on: ubuntu-latest
    steps:
      - name: Mark ghcr.io/bandulix/merkster public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PACKAGE: merkster
        run: |
          set -euo pipefail
          gh api --method PATCH \
            -H "Accept: application/vnd.github+json" \
            "/users/${OWNER}/packages/container/${PACKAGE}" \
            -f visibility=public
          gh api "/users/${OWNER}/packages/container/${PACKAGE}" --jq '{name,visibility,package_type,html_url}'
