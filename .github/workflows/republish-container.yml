name: Republish container

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  republish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show packages visible to this token
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          echo "user packages"
          gh api "/user/packages?package_type=container"
          echo "owner packages"
          gh api "/users/${{ github.repository_owner }}/packages?package_type=container"
          echo "owner package versions"
          gh api "/users/${{ github.repository_owner }}/packages/container/merkster/versions"

      - name: Delete existing package versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: merkster
          package-type: container
          min-versions-to-keep: 0
          num-old-versions-to-delete: 100

      - name: Delete the package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          for path in \
            "/users/${{ github.repository_owner }}/packages/container/merkster" \
            "/user/packages/container/merkster"
          do
            echo "DELETE $path"
            gh api --method DELETE -H "Accept: application/vnd.github+json" "$path"
          done

      - name: Wait for the package name to be free
        run: sleep 20

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if docker buildx build --push \
              --tag ghcr.io/bandulix/merkster:1.0.0 \
              --tag ghcr.io/bandulix/merkster:1.0 \
              --tag ghcr.io/bandulix/merkster:latest \
              .; then
              exit 0
            fi
            echo "push attempt ${attempt} failed"
            sleep 30
          done
          exit 1
