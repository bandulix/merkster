name: Republish container

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/republish-container.yml

permissions:
  contents: read
  packages: write

jobs:
  republish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Delete the existing package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          base="/users/${{ github.repository_owner }}/packages/container/merkster"
          untagged="$(gh api --paginate "${base}/versions" --jq '.[] | select((.metadata.container.tags // []) | length == 0) | .id')"
          for id in $untagged; do
            echo "Deleting untagged version ${id}"
            gh api --method DELETE "${base}/versions/${id}"
          done
          echo "Deleting package ${base}"
          gh api --method DELETE "$base"

      - name: Wait for the package name to be free
        run: sleep 20

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if docker buildx build --push \
              --tag ghcr.io/bandulix/merkster:1.0.0 \
              --tag ghcr.io/bandulix/merkster:1.0 \
              --tag ghcr.io/bandulix/merkster:latest \
              .; then
              exit 0
            fi
            echo "push attempt ${attempt} failed"
            sleep 30
          done
          exit 1

      - name: Check whether an anonymous pull works
        run: |
          set +e
          token="$(curl -fsS "https://ghcr.io/token?service=ghcr.io&scope=repository:bandulix/merkster:pull" | jq -r '.token // empty')"
          code="$(curl -sS -o /tmp/manifest.json -w '%{http_code}' -H "Authorization: Bearer ${token}" -H "Accept: application/vnd.oci.image.index.v1+json" https://ghcr.io/v2/bandulix/merkster/manifests/latest)"
          echo "anonymous manifest status: ${code}"
          if [ "$code" = "200" ]; then
            echo "Package is public"
          else
            echo "Package is not anonymously readable"
            head -c 300 /tmp/manifest.json || true
          fi
