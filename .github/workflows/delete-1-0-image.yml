name: Delete 1.0 image

on:
  workflow_dispatch:

permissions:
  packages: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete the 1.0 container versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          for id in 1402135468 1402135447 1402135413; do
            gh api --method DELETE "/users/bandulix/packages/container/merkster/versions/${id}"
          done
