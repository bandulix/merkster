name: Delete 1.0 image

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/delete-1-0-image.yml

permissions:
  packages: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete the 1.0 container versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          for id in 1402135468 1402135447 1402135413; do
            status=$(gh api --method DELETE -i "/users/bandulix/packages/container/merkster/versions/${id}" | awk 'BEGIN{code=""} /^HTTP/{code=$2} END{print code}')
            echo "version ${id} -> ${status}"
            if [ "$status" != "204" ] && [ "$status" != "404" ]; then
              exit 1
            fi
          done
