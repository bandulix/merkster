name: Bug report
description: Something in Merkster does not work as described.
title: "Bug: "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: App version from Settings, or the image tag (for example 1.0.0).
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: how
    attributes:
      label: How you run it
      options:
        - Docker Compose
        - GitHub Container Registry image
        - npm run dev:server and Vite
        - Other
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Node version, browser, and whether mock sign-in or real Google is in use. Do not include secrets, tokens, or student data.
    validations:
      required: false
