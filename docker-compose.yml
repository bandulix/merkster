# Merkster – published app image + Postgres 16.   docker compose up -d
# Test/dev without Google or an LLM:  make mock   (adds the mock Google + mock LLM via the "mock" profile)
name: merkster

services:
  app:
    image: ghcr.io/bandulix/merkster:latest
    pull_policy: always
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||8080)+'/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 10
    security_opt:
      - no-new-privileges:true

  # ---- TEST ONLY (profile "mock"): fake Google sign-in + fake vision LLM. The app refuses the mock
  # ---- provider when NODE_ENV=production, so this can never be switched on in a real deployment.
  mock-oidc:
    profiles: ["mock"]
    image: node:20.19-bookworm-slim
    command: ["node", "/tools/mock-oidc.mjs"]
    environment:
      MOCK_OIDC_ISSUER: http://mock-oidc:9090        # what the app server talks to
      MOCK_OIDC_PUBLIC_URL: http://localhost:9090    # what the browser is sent to
    volumes:
      - ./tools:/tools:ro
    ports:
      - "9090:9090"
    user: "1000:1000"

  mock-llm:
    profiles: ["mock"]
    image: node:20.19-bookworm-slim
    command: ["node", "/tools/mock-llm.mjs"]
    volumes:
      - ./tools:/tools:ro
    user: "1000:1000"

volumes:
  pgdata:
